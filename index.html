<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>BINGO CRBV</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{--azul:#0C2C84;--amarillo:#FFD600;--rojo:#e53935;--verde:#4caf50;}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  body{font-family:'Barlow Condensed',sans-serif;background:var(--azul);min-height:100vh;}

  /* HEADER */
  header{background:var(--azul);border-bottom:3px solid var(--amarillo);display:flex;align-items:center;justify-content:center;gap:12px;padding:8px 16px;position:relative;}
  .hesc{width:44px;height:44px;border-radius:50%;overflow:hidden;border:2px solid var(--amarillo);flex-shrink:0;}
  .hesc img{width:100%;height:100%;object-fit:cover;}
  header h1{font-family:'Bebas Neue',sans-serif;color:var(--amarillo);font-size:2rem;letter-spacing:4px;}
  .spill{position:absolute;right:12px;top:50%;transform:translateY(-50%);display:flex;align-items:center;gap:5px;font-size:11px;color:rgba(255,255,255,0.7);}
  .sdot{width:6px;height:6px;border-radius:50%;background:#f44336;}
  .sdot.on{background:#4caf50;animation:bl 1.6s infinite;}
  @keyframes bl{0%,100%{opacity:1}50%{opacity:0.3}}

  /* SALA BAR */
  .sala-bar{background:rgba(0,0,0,0.3);display:flex;align-items:center;justify-content:center;gap:8px;padding:7px 12px;border-bottom:1px solid rgba(255,214,0,0.2);}
  .sala-bar label{color:rgba(255,255,255,0.6);font-size:12px;}
  .sala-bar input{background:rgba(255,255,255,0.1);border:1px solid rgba(255,214,0,0.4);border-radius:6px;color:white;padding:5px 10px;font-family:'Barlow Condensed',sans-serif;font-size:13px;width:150px;outline:none;}
  .btn-conn{background:var(--amarillo);color:var(--azul);border:none;border-radius:6px;padding:5px 14px;font-family:'Bebas Neue',sans-serif;font-size:15px;cursor:pointer;}

  /* CONTENIDO */
  .contenido{padding:10px 10px;display:flex;flex-direction:column;align-items:center;gap:10px;}

  /* NÚMERO GRANDE */
  .num-wrap{text-align:center;}
  .ultimo-label{font-size:10px;letter-spacing:3px;color:rgba(255,214,0,0.55);text-transform:uppercase;}
  #numero-grande{font-family:'Bebas Neue',sans-serif;font-size:80px;line-height:1;color:var(--amarillo);text-shadow:0 3px 14px rgba(255,214,0,0.2);}
  #numero-grande.pop{animation:np 0.25s ease-out;}
  @keyframes np{0%{transform:scale(1.3)}100%{transform:scale(1)}}
  .conteo{font-size:12px;color:rgba(255,255,255,0.4);}

  /* HISTORIAL */
  .hist-label{font-size:10px;letter-spacing:2px;color:rgba(255,214,0,0.5);text-transform:uppercase;margin-bottom:5px;align-self:flex-start;width:100%;}
  .historial{display:flex;gap:5px;align-items:center;background:rgba(0,0,0,0.25);border:1px solid rgba(255,214,0,0.2);border-radius:10px;padding:7px 10px;min-height:44px;flex-wrap:wrap;width:100%;}
  .hball{width:32px;height:32px;border-radius:50%;background:var(--amarillo);color:var(--azul);display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:15px;flex-shrink:0;}
  .hball.nuevo{animation:bp 0.4s ease-out;}
  @keyframes bp{0%{transform:scale(0);opacity:0}60%{transform:scale(1.2)}100%{transform:scale(1);opacity:1}}
  .hball.viejo{background:rgba(255,214,0,0.25);color:rgba(255,214,0,0.7);}
  .hist-empty{font-size:12px;color:rgba(255,255,255,0.25);}

  /* CONTROLES */
  .controles{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center;width:100%;}
  .btn-reset{background:var(--rojo);color:white;border:none;border-radius:8px;padding:8px 18px;font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:2px;cursor:pointer;}
  .btn-sortear{background:var(--verde);color:white;border:none;border-radius:8px;padding:8px 18px;font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:2px;cursor:pointer;}
  .opciones{display:flex;gap:10px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,214,0,0.2);border-radius:10px;padding:8px 12px;flex-wrap:wrap;justify-content:center;}
  .opciones label{display:flex;align-items:center;gap:5px;color:rgba(255,255,255,0.85);font-size:14px;font-weight:600;cursor:pointer;}
  .opciones input[type="checkbox"]{width:15px;height:15px;accent-color:var(--amarillo);}

  /* TABLERO */
  .tablero{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;width:100%;}
  .numero{aspect-ratio:1;background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.15);border-radius:6px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-family:'Bebas Neue',sans-serif;font-size:16px;color:rgba(255,255,255,0.8);transition:background 0.12s;user-select:none;touch-action:manipulation;}
  .numero:active{transform:scale(0.93);}
  .numero.marcado{background:var(--amarillo);color:var(--azul);border-color:var(--amarillo);font-weight:700;}
  .numero.reciente{box-shadow:0 0 0 2px white,0 0 10px rgba(255,214,0,0.4);transform:scale(1.08);}

  .btn-del{background:rgba(255,255,255,0.12);color:rgba(255,255,255,0.85);border:1.5px solid rgba(255,255,255,0.25);border-radius:8px;padding:8px 14px;font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:2px;cursor:pointer;touch-action:manipulation;}
  .btn-del:active{background:rgba(255,100,100,0.3);}
  #toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.85);color:white;padding:8px 18px;border-radius:20px;font-size:13px;opacity:0;pointer-events:none;transition:opacity 0.3s;z-index:9999;border:1px solid rgba(255,214,0,0.3);white-space:nowrap;}
  #toast.show{opacity:1;}
</style>
</head>

    <div class="sdot" id="dot"></div>
    <span id="status-txt">—</span>
  </div>
</header>

<div class="sala-bar">
  <label>Sala:</label>
  <input type="text" id="sala-input" value="bingocrbv" placeholder="nombre de sala">
  <button class="btn-conn" onclick="conectar()">Conectar</button>
</div>

<div class="contenido">

  <div class="num-wrap">
    <div class="ultimo-label">Último número</div>
    <div id="numero-grande">--</div>
    <div class="conteo" id="conteo">0 de 90</div>
  </div>

  <div class="hist-label">Últimos números</div>
  <div class="historial" id="historial">
    <span class="hist-empty">Aún no salió ningún número</span>
  </div>

  <div class="controles">
    <button class="btn-sortear" onclick="sortearProximo()">🎲 SACAR BOLILLA</button>
    <button class="btn-reset" onclick="resetear()">↺ RESET</button>
    <div class="opciones">
      <label><input type="checkbox" id="linea1"> Línea 1</label>
      <label><input type="checkbox" id="linea2"> Línea 2</label>
      <label><input type="checkbox" id="linea3"> Línea 3</label>
      <label><input type="checkbox" id="bingo"> BINGO</label>
      <label><input type="checkbox" id="voz" checked> 🔊 Voz</label>
    </div>
    <button class="btn-del" onclick="borrarUltimo()">✕ BORRAR</button>
  </div>

  <div class="tablero" id="tablero"></div>

</div>

<div id="toast"></div>

<script>
var marcados=new Set(),ultimoNum=null,historial=[],opciones={linea1:false,linea2:false,linea3:false,bingo:false};
var fbSet=null,fbConectado=false;

// Cargar sala previa desde localStorage
document.addEventListener('DOMContentLoaded', function() {
  var salaGuardada = localStorage.getItem('bingo_sala');
  if(salaGuardada) {
    document.getElementById('sala-input').value = salaGuardada;
  }
  conectar();
});

async function conectar(){
  var sala=document.getElementById('sala-input').value.trim().replace(/\s+/g,'-')||'bingocrbv';
  localStorage.setItem('bingo_sala', sala);
  
  try{
    var {initializeApp}=await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js');
    var {getDatabase,ref,onValue,set}=await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js');
    var app=initializeApp({
      apiKey:"AIzaSyB965wMGbHGGjhrlBxDGR4lHZfEbZmMEMI",
      databaseURL:"https://crbv-bg-default-rtdb.firebaseio.com",
      projectId:"crbv-bg"
    },'app-'+sala+'-'+Date.now());
    var db=getDatabase(app);
    var r=ref(db,'rooms/'+sala);
    fbSet=function(d){return set(r,d);};
    onValue(r,function(snap){
      var d=snap.val();
      if(d){
        marcados=new Set(d.marcados||[]);
        ultimoNum=d.ultimo||null;
        historial=d.historial||[];
        opciones=d.opciones||opciones;
      }
      else{marcados=new Set();ultimoNum=null;historial=[];}
      renderTodo();
    });
    fbConectado=true;
    setStatus(true,sala);
    toast('✓ Conectado a "'+sala+'"');
  }catch(e){
    fbConectado=false;
    setStatus(false,'local');
    toast('Sin conexión a internet.');
  }
}

function setStatus(ok,txt){
  document.getElementById('dot').className='sdot'+(ok?' on':'');
  document.getElementById('status-txt').textContent=txt;
}

function pushEstado(){
  var d={marcados:[...marcados],ultimo:ultimoNum,historial:historial,opciones:opciones};
  if(fbConectado&&fbSet) fbSet(d);
}

function buildTablero(){
  var t=document.getElementById('tablero');t.innerHTML='';
  for(var i=1;i<=90;i++){
    var c=document.createElement('div');
    c.className='numero';c.textContent=i;c.id='n'+i;
    c.onclick=(function(n){return function(){marcar(n);};})(i);
    t.appendChild(c);
  }
}

function cantarNumero(n){
  if(!document.getElementById('voz').checked) return;
  if('speechSynthesis' in window){
    window.speechSynthesis.cancel();
    var msg = new SpeechSynthesisUtterance(n.toString());
    msg.lang = 'es-ES';
    window.speechSynthesis.speak(msg);
  }
}

function reproducirSonidoExito(){
  try {
    var ctx = new (window.AudioContext || window.webkitAudioContext)();
    var osc = ctx.createOscillator();
    var gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(523.25, ctx.currentTime); 
    osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.3);
    gain.gain.setValueAtTime(0.3, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.3);
  } catch(e){}
}

function marcar(n){
  if(marcados.has(n)) return;
  marcados.add(n);ultimoNum=n;historial.push(n);
  cantarNumero(n);
  renderTodo();pushEstado();
}

function sortearProximo(){
  if(marcados.size >= 90){
    toast('Ya salieron todos los números');
    return;
  }
  var disponibles = [];
  for(var i=1; i<=90; i++){
    if(!marcados.has(i)) disponibles.push(i);
  }
  var numElegido = disponibles[Math.floor(Math.random() * disponibles.length)];
  marcar(numElegido);
}

function renderHistorial(){
  var h=document.getElementById('historial');h.innerHTML='';
  if(historial.length===0){h.innerHTML='<span class="hist-empty">Aún no salió ningún número</span>';return;}
  historial.slice(-8).reverse().forEach(function(n,i){
    var b=document.createElement('div');
    b.className='hball'+(i===0?' nuevo':' viejo');
    b.textContent=n;h.appendChild(b);
  });
}

function renderTodo(){
  for(var i=1;i<=90;i++){
    var el=document.getElementById('n'+i);if(!el) continue;
    el.className='numero'+(marcados.has(i)?' marcado':'')+(i===ultimoNum?' reciente':'');
  }
  var ng=document.getElementById('numero-grande');
  ng.textContent=ultimoNum||'--';
  ng.classList.remove('pop');void ng.offsetWidth;if(ultimoNum) ng.classList.add('pop');
  document.getElementById('conteo').textContent=marcados.size+' de 90';
  ['linea1','linea2','linea3','bingo'].forEach(function(k){
    var el=document.getElementById(k);if(el) el.checked=opciones[k]||false;
  });
  renderHistorial();
}

function borrarUltimo(){
  if(!ultimoNum){ toast('No hay número para borrar'); return; }
  if(!confirm('¿Estás seguro de borrar el número ' + ultimoNum + '?')) return;
  
  marcados.delete(ultimoNum);
  historial = historial.filter(function(n){ return n !== ultimoNum; });
  var anterior = historial.length > 0 ? historial[historial.length-1] : null;
  ultimoNum = anterior;
  renderTodo(); pushEstado();
  toast('Número borrado');
}

function resetear(){
  if(!confirm('¿Reiniciar el bingo para todos?')) return;
  marcados=new Set();ultimoNum=null;historial=[];
  opciones={linea1:false,linea2:false,linea3:false,bingo:false};
  renderTodo();pushEstado();toast('Juego reiniciado');
}

['linea1','linea2','linea3','bingo'].forEach(function(k){
  document.getElementById(k).addEventListener('change',function(){
    opciones[k]=this.checked;
    if(this.checked){ reproducirSonidoExito(); }
    pushEstado();
  });
});

function toast(msg){
  var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');
  setTimeout(function(){t.classList.remove('show');},2500);
}

document.getElementById('sala-input').addEventListener('keydown',function(e){if(e.key==='Enter')conectar();});
setStatus(false,'Sin conectar');
buildTablero();
</script>
</body>
</html>

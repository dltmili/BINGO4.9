<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>BINGO CRBV</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root { --azul:#0C2C84; --amarillo:#FFD600; --rojo:#e53935; --verde:#4caf50; }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  body{font-family:'Barlow Condensed',sans-serif;background:var(--azul);min-height:100vh;color:white;}

  /* HEADER */
  header{background:var(--azul);border-bottom:3px solid var(--amarillo);display:flex;align-items:center;justify-content:center;gap:12px;padding:8px 16px;position:relative;}
  .hesc{width:44px;height:44px;border-radius:50%;overflow:hidden;border:2px solid var(--amarillo);flex-shrink:0;}
  .hesc img{width:100%;height:100%;object-fit:cover;}
  header h1{font-family:'Bebas Neue',sans-serif;color:var(--amarillo);font-size:2rem;letter-spacing:4px;}
  
  .badge-role{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:rgba(255,214,0,0.15);border:1px solid rgba(255,214,0,0.4);border-radius:20px;padding:3px 10px;font-size:11px;letter-spacing:1px;color:var(--amarillo);text-transform:uppercase;cursor:pointer;}
  .badge-role.admin{background:rgba(76,175,80,0.2);border-color:var(--verde);color:#81c784;}

  /* SALA Y CONEXION */
  .sala-bar{background:rgba(0,0,0,0.3);display:flex;align-items:center;justify-content:center;gap:8px;padding:7px 12px;border-bottom:1px solid rgba(255,214,0,0.2);flex-wrap:wrap;}
  .sala-bar label{color:rgba(255,255,255,0.6);font-size:12px;}
  .sala-bar input{background:rgba(255,255,255,0.1);border:1px solid rgba(255,214,0,0.4);border-radius:6px;color:white;padding:5px 10px;font-family:'Barlow Condensed',sans-serif;font-size:13px;width:130px;outline:none;}
  .sala-bar input:focus{border-color:var(--amarillo);}
  .btn-action{background:var(--amarillo);color:var(--azul);border:none;border-radius:6px;padding:5px 12px;font-family:'Bebas Neue',sans-serif;font-size:15px;cursor:pointer;}
  .btn-admin-login{background:rgba(255,255,255,0.15);color:white;border:1px solid rgba(255,255,255,0.3);}

  /* CONTENIDO PRINCIPAL */
  .contenido{padding:10px;display:flex;flex-direction:column;align-items:center;gap:10px;max-width:600px;margin:0 auto;}

  .conn-estado{display:flex;align-items:center;gap:6px;font-size:12px;color:rgba(255,255,255,0.5);width:100%;justify-content:center;}
  .sdot{width:7px;height:7px;border-radius:50%;background:var(--rojo);flex-shrink:0;}
  .sdot.on{background:var(--verde);animation:bl 1.6s infinite;}
  @keyframes bl{0%,100%{opacity:1}50%{opacity:0.3}}

  /* NUMERO PRINCIPAL */
  .num-wrap{text-align:center;padding:4px 0;}
  .ultimo-label{font-size:11px;letter-spacing:3px;color:rgba(255,214,0,0.6);text-transform:uppercase;}
  #numero-grande{font-family:'Bebas Neue',sans-serif;font-size:95px;line-height:1;color:var(--amarillo);text-shadow:0 0 30px rgba(255,214,0,0.3);}
  #numero-grande.pop{animation:np 0.3s ease-out;}
  @keyframes np{0%{transform:scale(1.3);opacity:0.5}100%{transform:scale(1);opacity:1}}
  .conteo{font-size:13px;color:rgba(255,255,255,0.4);}

  /* HISTORIAL */
  .hist-wrap{width:100%;}
  .hist-label{font-size:10px;letter-spacing:2px;color:rgba(255,214,0,0.5);text-transform:uppercase;margin-bottom:4px;}
  .historial{display:flex;gap:5px;align-items:center;background:rgba(0,0,0,0.25);border:1px solid rgba(255,214,0,0.2);border-radius:10px;padding:6px 10px;min-height:46px;flex-wrap:wrap;width:100%;}
  .hball{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:16px;flex-shrink:0;}
  .hball.nuevo{background:var(--amarillo);color:var(--azul);animation:bp 0.4s ease-out;}
  @keyframes bp{0%{transform:scale(0);opacity:0}60%{transform:scale(1.2)}100%{transform:scale(1);opacity:1}}
  .hball.viejo{background:rgba(255,214,0,0.2);color:rgba(255,214,0,0.65);}
  .hist-empty{font-size:12px;color:rgba(255,255,255,0.25);}

  /* PANEL DE CONTROL DE ADMIN */
  .admin-panel{display:none;width:100%;background:rgba(0,0,0,0.2);border:1px dashed rgba(255,214,0,0.4);border-radius:10px;padding:10px;margin-bottom:5px;}
  .admin-panel.active{display:block;}
  .admin-title{font-size:11px;color:var(--verde);letter-spacing:2px;text-transform:uppercase;margin-bottom:8px;text-align:center;}
  .admin-btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;}
  .btn-reset{background:var(--rojo);color:white;border:none;border-radius:6px;padding:6px 12px;font-family:'Bebas Neue',sans-serif;font-size:15px;cursor:pointer;}
  .btn-del{background:rgba(255,255,255,0.15);color:white;border:1px solid rgba(255,255,255,0.3);border-radius:6px;padding:6px 12px;font-family:'Bebas Neue',sans-serif;font-size:15px;cursor:pointer;}

  /* CHECKBOXES LINEAS Y BINGO */
  .opciones{display:flex;gap:10px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,214,0,0.15);border-radius:10px;padding:8px 14px;flex-wrap:wrap;justify-content:center;width:100%;}
  .opciones label{display:flex;align-items:center;gap:5px;color:rgba(255,255,255,0.85);font-size:14px;font-weight:600;}
  .opciones input[type="checkbox"]{width:16px;height:16px;accent-color:var(--amarillo);}
  body:not(.is-admin) .opciones label{pointer-events:none;}
  body:not(.is-admin) .opciones input{pointer-events:none;}

  /* TABLERO */
  .tablero{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;width:100%;}
  .numero{aspect-ratio:1;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.12);border-radius:6px;display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:17px;color:rgba(255,255,255,0.6);user-select:none;}
  body.is-admin .numero{cursor:pointer;}
  body:not(.is-admin) .numero{pointer-events:none;}
  .numero.marcado{background:var(--amarillo);color:var(--azul);border-color:var(--amarillo);font-weight:700;}
  .numero.reciente{box-shadow:0 0 0 2px white,0 0 12px rgba(255,214,0,0.5);}

  #offline-msg{display:none;background:rgba(229,57,53,0.15);border:1px solid rgba(229,57,53,0.4);border-radius:10px;padding:8px 12px;font-size:12px;color:rgba(255,180,180,0.9);text-align:center;width:100%;}
  #offline-msg.show{display:block;}

  #toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.88);color:white;padding:8px 18px;border-radius:20px;font-size:13px;opacity:0;pointer-events:none;transition:opacity 0.3s;z-index:9999;border:1px solid rgba(255,214,0,0.3);white-space:nowrap;}
  #toast.show{opacity:1;}
</style>
</head>
<body>

<header>
  <div class="hesc"><img src="data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wCEAAkGBxAPDw8NEBAQFg8QEBAVFRAVFRUVGBUaFxUWFhUXFxYYHSggGBwmHxgXITEhJSkrLi4uFyA1ODMtNygtMCsBCgoKDg0OGhAQGy4lICUtNS0tLS8tLy0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLf/AABEIAOEA4QMBEQACEQEDEQH/xAAbAAEAAgMBAQAAAAAAAAAAAAAAAQYCBQcEA//EAEcQAAEDAgMBCQcJBQgDAAAAAAEAAgMEEQUGIRIxBxMiQVFhcYGRFzJjcpKy4RQjQkNSk6GxwTM0U4KzFRY1YnN0wvAlotH/xgAbAQEAAgMBAQAAAAAAAAAAAAAAAQUDBAYCB//EADkRAAIBAwIDBgMHAwQDAQAAAAABAgMEEQUhEjFBBhMUUWFxFiKRMjNigaGxwTRC8CNS0eElNfEV/9oADAMBADrawingbutton="badge-role" id="role-badge" onclick="toggleAdminLogin()">ESPECTADOR</div>
  <h1>BINGO CRBV</h1>
</header>

<div class="sala-bar">
  <label for="sala-id">SALA:</label>
  <input type="text" id="sala-id" value="CRBV2026" placeholder="ID de Sala">
  <button class="btn-action" onclick="conectarSala()">CONECTAR</button>
  <button class="btn-action btn-admin-login" id="btn-login-toggle" onclick="toggleAdminLogin()">INGRESAR COMO ADMIN</button>
</div>

<div class="contenido">
  <div class="conn-estado">
    <div class="sdot" id="dot-estado"></div>
    <span id="txt-estado">Desconectado — Conéctate a una sala</span>
  </div>

  <div id="offline-msg">Sin conexión en tiempo real. Los cambios no se sincronizarán hasta reconectar.</div>

  <div class="num-wrap">
    <div class="ultimo-label">ÚLTIMO NÚMERO</div>
    <div id="numero-grande">--</div>
    <div class="conteo"><span id="cant-cantados">0</span> / 90</div>
  </div>

  <div class="hist-wrap">
    <div class="hist-label">ÚLTIMOS SORTEDOS</div>
    <div class="historial" id="historial">
      <span class="hist-empty">Esperando sorteo...</span>
    </div>
  </div>

  <div class="admin-panel" id="admin-panel">
    <div class="admin-title">★ Panel de Control de Administrador ★</div>
    <div class="admin-btns">
      <button class="btn-del" onclick="deshacerUltimo()">Deshacer Último Número</button>
      <button class="btn-reset" onclick="reiniciarJuego()">Reiniciar Bingo</button>
    </div>
  </div>

  <div class="opciones">
    <label><input type="checkbox" id="chk-l1" onchange="guardarEstadoAdmin()"> 1ª Línea</label>
    <label><input type="checkbox" id="chk-l2" onchange="guardarEstadoAdmin()"> 2ª Línea</label>
    <label><input type="checkbox" id="chk-bingo" onchange="guardarEstadoAdmin()"> BINGO</label>
  </div>

  <div class="tablero" id="tablero"></div>
</div>

<div id="toast"></div>

<script>
  const CLAVE_ADMIN = "1234"; // Clave por defecto para el administrador
  let esAdmin = false;
  let canalMQTT = null;
  let mqttClient = null;
  let salaActual = "";

  // Estado del juego
  let estadoJuego = {
    numeros: [],
    ultimo: null,
    l1: false,
    l2: false,
    bingo: false
  };

  // Generar tablero de 1 a 90
  const tableroEl = document.getElementById('tablero');
  for (let i = 1; i <= 90; i++) {
    const div = document.createElement('div');
    div.className = 'numero';
    div.dataset.num = i;
    div.textContent = i;
    div.onclick = () => seleccionarNumeroAdmin(i);
    tableroEl.appendChild(div);
  }

  function mostrarToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
  }

  function toggleAdminLogin() {
    if (esAdmin) {
      esAdmin = false;
      actualizarModoUI();
      mostrarToast("Modo Espectador activado");
    } else {
      const pass = prompt("Ingrese la clave de Administrador:");
      if (pass === CLAVE_ADMIN) {
        esAdmin = true;
        actualizarModoUI();
        mostrarToast("Modo Administrador activado");
      } else if (pass !== null) {
        alert("Clave incorrecta");
      }
    }
  }

  function actualizarModoUI() {
    const badge = document.getElementById('role-badge');
    const panel = document.getElementById('admin-panel');
    const btnLogin = document.getElementById('btn-login-toggle');

    if (esAdmin) {
      document.body.classList.add('is-admin');
      badge.textContent = "ADMINISTRADOR";
      badge.classList.add('admin');
      panel.classList.add('active');
      btnLogin.textContent = "SALIR DE ADMIN";
    } else {
      document.body.classList.remove('is-admin');
      badge.textContent = "ESPECTADOR";
      badge.classList.remove('admin');
      panel.classList.remove('active');
      btnLogin.textContent = "INGRESAR COMO ADMIN";
    }
  }

  function seleccionarNumeroAdmin(num) {
    if (!esAdmin) return;

    const idx = estadoJuego.numeros.indexOf(num);
    if (idx === -1) {
      estadoJuego.numeros.push(num);
      estadoJuego.ultimo = num;
    } else {
      estadoJuego.numeros.splice(idx, 1);
      estadoJuego.ultimo = estadoJuego.numeros[estadoJuego.numeros.length - 1] || null;
    }
    publicarEstado();
  }

  function deshacerUltimo() {
    if (!esAdmin || estadoJuego.numeros.length === 0) return;
    estadoJuego.numeros.pop();
    estadoJuego.ultimo = estadoJuego.numeros[estadoJuego.numeros.length - 1] || null;
    publicarEstado();
  }

  function reiniciarJuego() {
    if (!esAdmin) return;
    if (confirm("¿Está seguro de reiniciar todo el tablero?")) {
      estadoJuego = {
        numeros: [],
        ultimo: null,
        l1: false,
        l2: false,
        bingo: false
      };
      publicarEstado();
    }
  }

  function guardarEstadoAdmin() {
    if (!esAdmin) return;
    estadoJuego.l1 = document.getElementById('chk-l1').checked;
    estadoJuego.l2 = document.getElementById('chk-l2').checked;
    estadoJuego.bingo = document.getElementById('chk-bingo').checked;
    publicarEstado();
  }

  function renderizarTablero() {
    // Renderizado de números en tablero
    document.querySelectorAll('.numero').forEach(el => {
      const n = parseInt(el.dataset.num);
      const estaMarcado = estadoJuego.numeros.includes(n);
      const esElUltimo = n === estadoJuego.ultimo;

      el.classList.toggle('marcado', estaMarcado);
      el.classList.toggle('reciente', esElUltimo && estaMarcado);
    });

    // Número grande
    const ng = document.getElementById('numero-grande');
    if (estadoJuego.ultimo !== null) {
      if (ng.textContent !== String(estadoJuego.ultimo)) {
        ng.textContent = estadoJuego.ultimo;
        ng.classList.remove('pop');
        void ng.offsetWidth;
        ng.classList.add('pop');
      }
    } else {
      ng.textContent = '--';
    }

    // Conteo
    document.getElementById('cant-cantados').textContent = estadoJuego.numeros.length;

    // Checkboxes
    document.getElementById('chk-l1').checked = !!estadoJuego.l1;
    document.getElementById('chk-l2').checked = !!estadoJuego.l2;
    document.getElementById('chk-bingo').checked = !!estadoJuego.bingo;

    // Historial (últimos 5)
    const histEl = document.getElementById('historial');
    const ultimos = [...estadoJuego.numeros].reverse().slice(0, 6);

    if (ultimos.length === 0) {
      histEl.innerHTML = '<span class="hist-empty">Esperando sorteo...</span>';
    } else {
      histEl.innerHTML = ultimos.map((n, i) => `
        <div class="hball ${i === 0 ? 'nuevo' : 'viejo'}">${n}</div>
      `).join('');
    }
  }

  // --- CONEXIÓN MQTT PÚBLICA VÍA WEBSOCKETS ---
  function conectarSala() {
    const inputSala = document.getElementById('sala-id').value.trim();
    if (!inputSala) return alert("Ingrese un ID de sala válido");

    salaActual = inputSala;
    canalMQTT = "crbv/bingo/" + salaActual;

    document.getElementById('txt-estado').textContent = "Conectando a sala: " + salaActual + "...";

    // Cargar script MQTT dinámicamente si no está presente
    if (window.mqtt) {
      iniciarMQTT();
    } else {
      const script = document.createElement('script');
      script.src = "https://unpkg.com/mqtt/dist/mqtt.min.js";
      script.onload = iniciarMQTT;
      document.head.appendChild(script);
    }
  }

  function iniciarMQTT() {
    if (mqttClient) {
      mqttClient.end();
    }

    // Broker WebSocket MQTT público y gratuito
    mqttClient = mqtt.connect('wss://broker.emqx.io:8084/mqtt');

    mqttClient.on('connect', () => {
      document.getElementById('dot-estado').classList.add('on');
      document.getElementById('txt-estado').textContent = "Conectado a Sala: " + salaActual;
      document.getElementById('offline-msg').classList.remove('show');

      mqttClient.subscribe(canalMQTT, (err) => {
        if (!err && esAdmin) {
          // Publicar estado actual al unirse como admin
          publicarEstado();
        }
      });
    });

    mqttClient.on('message', (topic, message) => {
      if (topic === canalMQTT) {
        try {
          const data = JSON.parse(message.toString());
          estadoJuego = data;
          renderizarTablero();
        } catch(e) {
          console.error("Error leyendo datos del juego", e);
        }
      }
    });

    mqttClient.on('offline', () => {
      document.getElementById('dot-estado').classList.remove('on');
      document.getElementById('txt-estado').textContent = "Desconectado de la sala";
      document.getElementById('offline-msg').classList.add('show');
    });
  }

  function publicarEstado() {
    renderizarTablero();
    if (mqttClient && mqttClient.connected) {
      mqttClient.publish(canalMQTT, JSON.stringify(estadoJuego), { retain: true });
    }
  }

  // Autoconectar por defecto a la sala CRBV2026
  window.onload = () => {
    actualizarModoUI();
    conectarSala();
  };
</script>
</body>
</html>
